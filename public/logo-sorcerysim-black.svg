<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 112" width="500" height="112">

  <!-- ── Black background ── -->
  <rect width="500" height="112" fill="#000000"/>

  <!-- ── Air (top-left): upward △ + crossbar — purple ── -->
  <g transform="translate(28, 30)" stroke="#a78bfa" stroke-width="2.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-20 L-17.3,10 L17.3,10Z"/>
    <line x1="-8.7" y1="-5" x2="8.7" y2="-5"/>
  </g>

  <!-- ── Earth (top-right): downward △ + crossbar — gold ── -->
  <g transform="translate(76, 30)" stroke="#d4a017" stroke-width="2.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,20 L-17.3,-10 L17.3,-10Z"/>
    <line x1="-8.7" y1="5" x2="8.7" y2="5"/>
  </g>

  <!-- ── Fire (bottom-left): upward △ — orange ── -->
  <g transform="translate(28, 82)" stroke="#f97316" stroke-width="2.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-20 L-17.3,10 L17.3,10Z"/>
  </g>

  <!-- ── Water (bottom-right): downward △ — cyan ── -->
  <g transform="translate(76, 82)" stroke="#38bdf8" stroke-width="2.8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,20 L-17.3,-10 L17.3,-10Z"/>
  </g>

  <!-- ── Vertical divider ── -->
  <line x1="112" y1="10" x2="112" y2="102" stroke="#374151" stroke-width="1.5"/>

  <!-- ── Site name ── -->
  <text x="132" y="68"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52" font-weight="bold"
    fill="#fbbf24" letter-spacing="-1">SorcerySim</text>

</svg>
